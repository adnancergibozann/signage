<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Örneği</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      padding: 2rem;
      background: #f5f5f5;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    h1 {
      margin-bottom: 1.5rem;
    }
    .widget-grid {
      display: grid;
      gap: 1.5rem;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }
  </style>
</head>
<body>
  <h1>Widget Yerleştirme Örneği</h1>
  <p>Bu sayfa, yönetim panelinde tanımladığınız sınıfları kullanarak widget'ların nasıl görüneceğini gösterir.</p>
  <p>Panelde sınıf oluşturup program girdikten sonra bu sayfayı yenileyin.</p>

  <div class="widget-grid">
    <div data-widget="countdown" data-class="10-A"></div>
    <div data-widget="schedule" data-class="10-A" data-view="daily"></div>
    <div data-widget="schedule" data-view="weekly"></div>
  </div>

  <script src="widget.js"></script>
</body>
</html>
