<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ders Programı Geri Sayım Widget'ı</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 2rem;
    }
    main {
      width: min(480px, 100%);
    }
    header {
      margin-bottom: 1.5rem;
      text-align: center;
    }
    header h1 {
      margin-bottom: 0.5rem;
    }
    header p {
      color: #4a4a4a;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Geri Sayım Widget'ı</h1>
      <p>Yönetim panelinde oluşturduğunuz sınıflar arasından birini seçerek canlı geri sayımı görüntüleyin.</p>
    </header>

    <section>
      <label for="class-select" class="form-label">Sınıf Seçin</label>
      <select id="class-select" class="input"></select>
    </section>

    <section style="margin-top: 1.5rem;">
      <div id="countdown-widget" data-widget="countdown"></div>
    </section>
  </main>

  <script src="widget.js"></script>
  <script>
    (function initCountdownPage() {
      const selectEl = document.getElementById('class-select');
      const widgetContainer = document.getElementById('countdown-widget');
      const STORAGE_KEY = 'dp_data_v1';

      function getData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (err) {
          console.error('LocalStorage verisi okunamadı.', err);
          return null;
        }
      }

      function populateClassOptions() {
        const data = getData();
        selectEl.innerHTML = '';
        const currentClass = widgetContainer.getAttribute('data-class');

        if (!data || !Array.isArray(data.classes) || data.classes.length === 0) {
          const option = document.createElement('option');
          option.textContent = 'Önce yönetim panelinden sınıf ekleyin';
          option.disabled = true;
          option.selected = true;
          selectEl.appendChild(option);
          selectEl.disabled = true;
          widgetContainer.removeAttribute('data-class');
          return;
        }

        selectEl.disabled = false;
        let selectedSet = false;

        data.classes.forEach(({ id, name }, index) => {
          const option = document.createElement('option');
          option.value = id;
          option.textContent = name || id;
          if (!selectedSet && (currentClass ? currentClass === id : index === 0)) {
            option.selected = true;
            selectEl.value = id;
            widgetContainer.setAttribute('data-class', id);
            selectedSet = true;
          }
          selectEl.appendChild(option);
        });

        if (!selectedSet && data.classes.length) {
          const first = data.classes[0];
          widgetContainer.setAttribute('data-class', first.id);
          selectEl.value = first.id;
        }
      }

      selectEl.addEventListener('change', (event) => {
        widgetContainer.setAttribute('data-class', event.target.value);
      });

      window.addEventListener('storage', (event) => {
        if (event.key === STORAGE_KEY) {
          populateClassOptions();
        }
      });

      populateClassOptions();
    })();
  </script>
</body>
</html>
